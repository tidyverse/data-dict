project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - examples/rendered/*.html

website:
  title: data-dict
  site-url: https://data-dict.tidyverse.org
  repo-url: https://github.com/tidyverse/data-dict
  description: >
    `data-dict.yaml` is a lightweight YAML specification for data dictionaries, 
    paired with a command line application for validation. The specification
    describes collections of related tables — their columns, types, 
    constraints, relationships — as well as a glossay for domain vocabulary.
  llms-txt: true
  favicon: favicon.svg

  navbar:
    background: primary
    search: true
    tools:
      - icon: github
        href: https://github.com/tidyverse/data-dict
        aria-label: GitHub

  sidebar:
    style: docked
    # Keep all top-level entries (e.g. the "Guide" section) expanded; never
    # collapse them. collapse-level must exceed the sidebar's nesting depth.
    contents:
      - href: index.md
        text: Overview
      - href: install.md
        text: Install
      - href: spec.md
        text: Specification
      - text: Validation
        href: validation.md
        contents:
          - href: expressions.md
            text: Expressions
          - href: report.md
            text: Report
      - text: Developer details
        contents:
          - href: expression-execution.md
            text: Executing expressions
          - href: floating-point.md
            text: Floating point
          - href: export.md
            text: Export
      - href: examples/index.qmd
        text: Examples

format:
  html:
    theme: 
      light: [cosmo, theme.scss, theme-light.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    toc: true
    toc-depth: 4
    include-in-header:
      - text: <script defer data-domain="data-dict.tidyverse.org" src="https://plausible.io/js/plausible.js"></script>
      - text: |
          <script src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js"
                  data-dark-bg="#404041"></script>
      - file: _dark-default.html
